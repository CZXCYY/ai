<canvas id="bg-canvas"></canvas>

<script>
// ═══════════════════════════════════════════════
// 粒子背景
// ═══════════════════════════════════════════════
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const NUM = 60;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function createParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.1
    };
  }

  function init() {
    resize();
    particles = Array.from({length: NUM}, createParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 星点
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(167,139,250,${p.alpha})`;
      ctx.fill();
    });
    // 连接线
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(99,102,241,${(1 - dist / 120) * 0.08})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>

<script>

const ALL_QUESTIONS = [

  { id:'c1',  qType:'choice', dim:0, text:'面对一个完全没有答案的难题，你会怎么做？',         options:['查资料，从头学起','先自己想一想','先搁置，以后再说','直接问AI帮忙'], tags:['explorer','thinker','sceptic','collaborator'] },

// ═══════════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fingerprint() {
  const keys = [navigator.userAgent, navigator.language,
    screen.width + 'x' + screen.height, screen.colorDepth,
    new Date().getTimezoneOffset()];
  let h = 0x811c9dc5;
  for (const s of keys) {
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h * 0x01000193) >>> 0;
    }
  }
  return h;
}

function persist(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

function retrieve(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function saveHistory(record) {
  const h = retrieve('aimind_h', []);
  h.unshift(record);
  persist('aimind_h', h.slice(0, 20));
}

function getHistory() {

function delHistory(i) {
  const h = getHistory();
  h.splice(i, 1);
  persist('aimind_h', h);
}

// ═══════════════════════════════════════════════
// 题目生成（伪随机LCG，确保每次不同）
// ═══════════════════════════════════════════════
function genQuestions() {
  const seed = (Date.now() + Math.random() * 99999 + screen.width) | 0;
  const rng = lcgRNG(seed);
  const shuffled = arr => shuffleWithRNG(arr, rng);

  const choices = shuffled([...ALL_QUESTIONS.filter(q => q.qType === 'choice')]).slice(0, 8);
  const tf     = shuffled([...ALL_QUESTIONS.filter(q => q.qType === 'tf')]).slice(0, 6);
  const sorts  = shuffled([...ALL_QUESTIONS.filter(q => q.qType === 'sort')]).slice(0, 1);

  return shuffled([...choices, ...tf, ...sorts]);
}

function lcgRNG(seed) {
  let s = seed;
  return () => {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

function shuffleWithRNG(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ═══════════════════════════════════════════════
// 计分（20%高分桶，每10人约2人上90）
// ═══════════════════════════════════════════════
function calcResult() {
  const counts = [{}, {}, {}, {}];
  state.questions.forEach(q => {
    const a = state.answers[q.id];
    if (a === undefined) return;
    let tag;
    if (q.qType === 'choice') tag = q.tags[a];
    else if (q.qType === 'tf') tag = q.tags[0];
    else tag = q.tags[a[0]];
    if (!counts[q.dim][tag]) counts[q.dim][tag] = 0;
    counts[q.dim][tag]++;
  });

  let pcts = [75, 75, 75, 75];
  for (let d = 0; d < 4; d++) {
    const vals = Object.values(counts[d]);
    const total = vals.reduce((s, v) => s + v, 0);
    if (total > 0) {
      const max = Math.max(...vals);
      pcts[d] = Math.round(60 + (max / total) * 35);
    }
  }

  // 分桶：20%高分桶（1/5），80%普通桶
  const fp = fingerprint();
  const isHighBucket = (fp % 5) < 1;

  const rawBase = Math.round(pcts[0] * 0.35 + pcts[1] * 0.25 + pcts[2] * 0.2 + pcts[3] * 0.2);

  let total;
  if (isHighBucket) {
    const base  = Math.round(rawBase * 0.95);
    const bonus = Math.floor(Math.random() * 23);   // 0-22
    total = Math.min(98, base + bonus);
  } else {
    const base  = Math.round(rawBase * 0.82);
    const bonus = Math.floor(Math.random() * 12);   // 0-11
    total = Math.min(88, base + bonus + 18);
  }

  // 类型判定（8类型）
  let mainType = '潜力股型';
  const sorted = [...pcts].sort((a, b) => b - a);
  if (sorted[0] - sorted[3] >= 15) {
    const mainDim = pcts.indexOf(sorted[0]);
    const dimMap = { 0: '逻辑大师', 1: '表达大师', 2: 'AI指挥官', 3: '创意鬼才' };
    mainType = dimMap[mainDim] || '融合思辨者';
  } else {
    const avg = pcts.reduce((s, v) => s + v, 0) / 4;
    const dev = Math.sqrt(pcts.reduce((s, v) => s + (v - avg) ** 2, 0) / 4);
    if (dev < 8) mainType = '融合思辨者';
    else {
      const minIdx = pcts.indexOf(Math.min(...pcts));
      if (minIdx === 0) mainType = '架构设计师';
      else if (minIdx === 3) mainType = '逆境求生者';
      else if (minIdx === 1) mainType = '表达大师';
      else mainType = '融合思辨者';
    }
  }

  return { total, pcts, type: mainType };
}

// 核心动作
// ═══════════════════════════════════════════════
function startTest() {
  state = { view: 'test', questions: genQuestions(), current: 0, answers: {}, completed: false, result: null, shared: false };
  render();
}

function nextQ() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    render();
  }
}

function selectOption(idx) {
  const q = state.questions[state.current];
  if (q.qType === 'sort') return;
  state.answers[q.id] = idx;
  if (state.current < state.questions.length - 1) {
    setTimeout(() => { state.current++; render(); }, 160);
  } else {
    setTimeout(doSubmit, 180);
  }
}

function selectTF(idx) {
  const q = state.questions[state.current];
  state.answers[q.id] = idx;
  if (state.current < state.questions.length - 1) {
    setTimeout(() => { state.current++; render(); }, 160);
  } else {
    setTimeout(doSubmit, 180);
  }
}

function moveSortItem(pos, dir) {
  const q = state.questions[state.current];
  const order = state.answers[q.id] ? [...state.answers[q.id]] : [0, 1, 2, 3];
  const np = pos + dir;
  if (np < 0 || np >= order.length) return;
  [order[pos], order[np]] = [order[np], order[pos]];
  state.answers[q.id] = order;
  render();
}

function confirmSort() {
  const q = state.questions[state.current];
  if (!state.answers[q.id]) { showToast('请先调整排序'); return; }
  if (state.current < state.questions.length - 1) {
    setTimeout(() => { state.current++; render(); }, 200);
  } else {
    setTimeout(doSubmit, 200);
  }
}

function doSubmit() {
  state.result   = calcResult();
  state.completed = true;
  state.view      = 'result';
  state.shared    = false;
  saveHistory({ type: state.result.type, score: state.result.total, date: new Date().toLocaleDateString('zh-CN') });
  render();
}

function restartTest() {
  startTest();
}

function goHome() {
  state = { view: 'welcome', questions: [], current: 0, answers: {}, completed: false, result: null, shared: false };
  render();
}

function showHistory() {
  state.view = 'history';
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const param   = el.dataset.param;

  switch (action) {
    case 'accept':      startTest();              break;
    case 'next':        nextQ();                 break;
    case 'submit':      doSubmit();              break;
    case 'option':      selectOption(+param);    break;
    case 'tf':          selectTF(+param);        break;
    case 'confirmSort': confirmSort();           break;
    case 'moveSort': { const [p, d] = param.split(',').map(Number); moveSortItem(p, d); break; }
    case 'share':       downloadShare();         break;
    case 'restart':     restartTest();            break;
    case 'home':        goHome();               break;
    case 'history':     showHistory();           break;
    case 'delHistory':  delHistory(+param); render(); break;
  }
});

// ═══════════════════════════════════════════════
// 分享图
// ═══════════════════════════════════════════════
function downloadShare() {
  const r = state.result;
  const t = TYPE_DATA[r.type];
  const cv = document.createElement('canvas');
  cv.width = 400; cv.height = 580;
  const ctx = cv.getContext('2d');

  // 背景
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, 400, 580);

  // 渐变光晕
  const grad = ctx.createRadialGradient(200, 0, 0, 200, 0, 500);
  grad.addColorStop(0, 'rgba(99,102,241,0.25)');
  grad.addColorStop(0.5, 'rgba(167,85,247,0.08)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 400, 350);

  // 顶部标签
  ctx.fillStyle = 'rgba(99,102,241,0.15)';
  ctx.beginPath(); ctx.roundRect(140, 30, 120, 28, 14); ctx.fill();
  ctx.fillStyle = '#a5b4fc'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('AI思维测试', 200, 49);

  // 分数
  ctx.fillStyle = '#f1f5f9'; ctx.font = 'bold 72px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(r.total, 200, 130);

  // 标签
  ctx.fillStyle = 'rgba(99,102,241,0.2)';
  ctx.beginPath(); ctx.roundRect(120, 148, 160, 38, 19); ctx.fill();
  ctx.strokeStyle = 'rgba(99,102,241,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(120, 148, 160, 38, 19); ctx.stroke();
  ctx.fillStyle = '#f1f5f9'; ctx.font = 'bold 17px sans-serif';
  ctx.fillText(t.icon + ' ' + r.type, 200, 175);

  // 雷达
  const colors = ['#818cf8','#34d399','#fbbf24','#f472b6'];
  const names  = ['逻辑推理','语言表达','AI协作','创意想象'];
  r.pcts.forEach((p, i) => {
    const y = 218 + i * 52;
    ctx.fillStyle = '#94a3b8'; ctx.font = '13px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(names[i], 44, y);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.roundRect(44, y + 7, 195, 6, 3); ctx.fill();
    ctx.fillStyle = colors[i];
    ctx.beginPath(); ctx.roundRect(44, y + 7, 195 * p / 100, 6, 3); ctx.fill();
    ctx.fillStyle = colors[i]; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(p + '%', 300, y + 3);
  });

  // 底部语
  ctx.fillStyle = '#475569'; ctx.font = 'italic 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('"' + t.super + '"', 200, 528);

  ctx.fillStyle = '#3b3b5c'; ctx.font = '10px sans-serif';
  ctx.fillText('czxcyy.github.io/ai', 200, 558);

  const link = document.createElement('a');
  link.download = `AI思维测试_${r.total}分_${r.type}.png`;
  link.href = cv.toDataURL();
  link.click();

  if (!state.shared) {
    state.shared = true;
    render();
    showToast('分享图已保存！完整报告已解锁 🌟');
  } else {
    showToast('分享图已保存！');
  }
}

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
render();
</script>
