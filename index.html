<canvas id="bg-canvas"></canvas>

<script>
// ═══════════════════════════════════════════════
// 粒子背景
// ═══════════════════════════════════════════════
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const NUM = 60;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function createParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.1
    };
  }

  function init() {
    resize();
    particles = Array.from({length: NUM}, createParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 星点
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(167,139,250,${p.alpha})`;
      ctx.fill();
    });
    // 连接线
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(99,102,241,${(1 - dist / 120) * 0.08})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>

// ═══════════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fingerprint() {
  const keys = [navigator.userAgent, navigator.language,
    screen.width + 'x' + screen.height, screen.colorDepth,
    new Date().getTimezoneOffset()];
  let h = 0x811c9dc5;
  for (const s of keys) {
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h * 0x01000193) >>> 0;
    }
  }
  return h;
}

function persist(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

function retrieve(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function saveHistory(record) {
  const h = retrieve('aimind_h', []);
  h.unshift(record);
  persist('aimind_h', h.slice(0, 20));
}

function getHistory() {
  return retrieve('aimind_h', []);
}

function delHistory(i) {
  const h = getHistory();
  h.splice(i, 1);
  persist('aimind_h', h);
}

// ═══════════════════════════════════════════════
// 题目生成（伪随机LCG，确保每次不同）
// ═══════════════════════════════════════════════
function genQuestions() {
  const seed = (Date.now() + Math.random() * 99999 + screen.width) | 0;
  const rng = lcgRNG(seed);
  const shuffled = arr => shuffleWithRNG(arr, rng);

  const choices = shuffled([...ALL_QUESTIONS.filter(q => q.qType === 'choice')]).slice(0, 8);
  const tf     = shuffled([...ALL_QUESTIONS.filter(q => q.qType === 'tf')]).slice(0, 6);
  const sorts  = shuffled([...ALL_QUESTIONS.filter(q => q.qType === 'sort')]).slice(0, 1);

  return shuffled([...choices, ...tf, ...sorts]);
}

function lcgRNG(seed) {
  let s = seed;
  return () => {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

function shuffleWithRNG(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ═══════════════════════════════════════════════
// 计分（20%高分桶，每10人约2人上90）
// ═══════════════════════════════════════════════
function calcResult() {
  const counts = [{}, {}, {}, {}];
  state.questions.forEach(q => {
    const a = state.answers[q.id];
    if (a === undefined) return;
    let tag;
    if (q.qType === 'choice') tag = q.tags[a];
    else if (q.qType === 'tf') tag = q.tags[0];
    else tag = q.tags[a[0]];
    if (!counts[q.dim][tag]) counts[q.dim][tag] = 0;
    counts[q.dim][tag]++;
  });

  let pcts = [75, 75, 75, 75];
  for (let d = 0; d < 4; d++) {
    const vals = Object.values(counts[d]);
    const total = vals.reduce((s, v) => s + v, 0);
    if (total > 0) {
      const max = Math.max(...vals);
      pcts[d] = Math.round(60 + (max / total) * 35);
    }
  }

  // 分桶：20%高分桶（1/5），80%普通桶
  const fp = fingerprint();
  const isHighBucket = (fp % 5) < 1;

  const rawBase = Math.round(pcts[0] * 0.35 + pcts[1] * 0.25 + pcts[2] * 0.2 + pcts[3] * 0.2);

  let total;
  if (isHighBucket) {
    const base  = Math.round(rawBase * 0.95);
    const bonus = Math.floor(Math.random() * 23);   // 0-22
    total = Math.min(98, base + bonus);
  } else {
    const base  = Math.round(rawBase * 0.82);
    const bonus = Math.floor(Math.random() * 12);   // 0-11
    total = Math.min(88, base + bonus + 18);
  }

  // 类型判定（8类型）
  let mainType = '潜力股型';
  const sorted = [...pcts].sort((a, b) => b - a);
  if (sorted[0] - sorted[3] >= 15) {
    const mainDim = pcts.indexOf(sorted[0]);
    const dimMap = { 0: '逻辑大师', 1: '表达大师', 2: 'AI指挥官', 3: '创意鬼才' };
    mainType = dimMap[mainDim] || '融合思辨者';
  } else {
    const avg = pcts.reduce((s, v) => s + v, 0) / 4;
    const dev = Math.sqrt(pcts.reduce((s, v) => s + (v - avg) ** 2, 0) / 4);
    if (dev < 8) mainType = '融合思辨者';
    else {
      const minIdx = pcts.indexOf(Math.min(...pcts));
      if (minIdx === 0) mainType = '架构设计师';
      else if (minIdx === 3) mainType = '逆境求生者';
      else if (minIdx === 1) mainType = '表达大师';
      else mainType = '融合思辨者';
    }
  }

  return { total, pcts, type: mainType };
}

// ═══════════════════════════════════════════════
// 核心动作
// ═══════════════════════════════════════════════
function startTest() {
  state = { view: 'test', questions: genQuestions(), current: 0, answers: {}, completed: false, result: null, shared: false };
  render();
}

function nextQ() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    render();
  }
}

function selectOption(idx) {
  const q = state.questions[state.current];
  if (q.qType === 'sort') return;
  state.answers[q.id] = idx;
  if (state.current < state.questions.length - 1) {
    setTimeout(() => { state.current++; render(); }, 160);
  } else {
    setTimeout(doSubmit, 180);
  }
}

function selectTF(idx) {
  const q = state.questions[state.current];
  state.answers[q.id] = idx;
  if (state.current < state.questions.length - 1) {
    setTimeout(() => { state.current++; render(); }, 160);
  } else {
    setTimeout(doSubmit, 180);
  }
}

function moveSortItem(pos, dir) {
  const q = state.questions[state.current];
  const order = state.answers[q.id] ? [...state.answers[q.id]] : [0, 1, 2, 3];
  const np = pos + dir;
  if (np < 0 || np >= order.length) return;
  [order[pos], order[np]] = [order[np], order[pos]];
  state.answers[q.id] = order;
  render();
}

function confirmSort() {
  const q = state.questions[state.current];
  if (!state.answers[q.id]) { showToast('请先调整排序'); return; }
  if (state.current < state.questions.length - 1) {
    setTimeout(() => { state.current++; render(); }, 200);
  } else {
    setTimeout(doSubmit, 200);
  }
}

function doSubmit() {
  state.result   = calcResult();
  state.completed = true;
  state.view      = 'result';
  state.shared    = false;
  saveHistory({ type: state.result.type, score: state.result.total, date: new Date().toLocaleDateString('zh-CN') });
  render();
}

function restartTest() {
  startTest();
}

function goHome() {
  state = { view: 'welcome', questions: [], current: 0, answers: {}, completed: false, result: null, shared: false };
  render();
}

function showHistory() {
  state.view = 'history';
  render();
}

// ═══════════════════════════════════════════════
// 事件委托
// ═══════════════════════════════════════════════
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const param   = el.dataset.param;

  switch (action) {
    case 'accept':      startTest();              break;
    case 'next':        nextQ();                 break;
    case 'submit':      doSubmit();              break;
    case 'option':      selectOption(+param);    break;
    case 'tf':          selectTF(+param);        break;
    case 'confirmSort': confirmSort();           break;
    case 'moveSort': { const [p, d] = param.split(',').map(Number); moveSortItem(p, d); break; }
    case 'share':       downloadShare();         break;
    case 'restart':     restartTest();            break;
    case 'home':        goHome();               break;
    case 'history':     showHistory();           break;
    case 'delHistory':  delHistory(+param); render(); break;
  }
});

// ═══════════════════════════════════════════════
// 渲染层
// ═══════════════════════════════════════════════
function render() {
  document.getElementById('app').innerHTML =
    state.view === 'privacy' ? renderPrivacy() :
    state.view === 'welcome' ? renderWelcome() :
    state.view === 'test'    ? renderTest()    :
    state.view === 'result'  ? renderResult()  :
                               renderHistory();
}

function renderPrivacy() {
  return `<div id="privacyModal">
    <div class="privacy-card">
      <div class="privacy-icon">🔐</div>
      <div class="privacy-title">隐私说明</div>
      <div class="privacy-desc">
        <p>欢迎参与 AI 思维测试！</p>
        <p>本测试完全匿名，无需注册。我们通过设备指纹生成随机得分，用于产品优化。</p>
        <p>测试数据仅存储在您的本地设备，不会传输至任何服务器。</p>
      </div>
      <button class="accept-btn" data-action="accept">我已知晓，开始测试 →</button>
    </div>
  </div>`;
}

function renderWelcome() {
  return `
  <div class="welcome-page">
    <div class="mind-badge"><span class="dot"></span>AI 时代专属 · 8种思维类型</div>

    <p class="welcome-sub">

    </p>
    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-num">8</div>
        <div class="stat-label">种思维类型</div>
      </div>

        <div class="stat-num">15</div>
        <div class="stat-label">道精选题目</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">3'</div>
        <div class="stat-label">完成时间</div>
      </div>
    </div>
    <button class="start-btn" data-action="accept">🧠 开始测试</button>
    <p class="welcome-hint">完全匿名 · 无需注册 · 即时出结果</p>
    <div class="features">
      <div class="feat-chip"><span class="icon">🔮</span> 随机抽题</div>
      <div class="feat-chip"><span class="icon">⚡</span> 精确分桶</div>
      <div class="feat-chip"><span class="icon">💎</span> 详细报告</div>
    </div>
    <p class="welcome-footer">AI思维测试 · 探索认知的无限可能</p>
  </div>`;
}

function renderTest() {
  const q      = state.questions[state.current];
  const total  = state.questions.length;
  const done   = Object.keys(state.answers).length;
  const isLast = state.current === total - 1;
  const ans    = state.answers[q.id];

  let body = '';
  if (q.qType === 'choice') {
    body = q.options.map((opt, i) => `
      <div class="option ${ans === i ? 'selected' : ''}" data-action="option" data-param="${i}">
        <div class="opt-radio"></div>
        <div class="opt-label">${String.fromCharCode(65 + i)}</div>
        <div class="opt-text">${opt}</div>
      </div>`).join('');
  } else if (q.qType === 'tf') {
    body = `<div class="tf-options">
      <div class="tf-btn ${ans === 0 ? 'selected' : ''}" data-action="tf" data-param="0">
        <span class="tf-icon">✅</span><div class="tf-label">同意</div><div class="tf-desc">符合我的想法</div>
      </div>
      <div class="tf-btn ${ans === 1 ? 'selected' : ''}" data-action="tf" data-param="1">
        <span class="tf-icon">❌</span><div class="tf-label">不同意</div><div class="tf-desc">不太符合</div>
      </div>
    </div>`;
  } else if (q.qType === 'sort') {
    const order = ans ? ans : [0, 1, 2, 3];
    body = `${order.map((itemIdx, pos) => `
      <div class="sort-item">
        <span class="sort-num">${pos + 1}</span>
        <span class="sort-text">${q.items[itemIdx]}</span>
        <button class="sort-btn" data-action="moveSort" data-param="${pos},-1" ${pos === 0 ? 'disabled' : ''}>↑</button>
        <button class="sort-btn" data-action="moveSort" data-param="${pos},1"  ${pos === order.length - 1 ? 'disabled' : ''}>↓</button>
      </div>`).join('')}
    <p class="sort-hint">📌 点击 ↑↓ 调整顺序，最重要排第一</p>
    <button class="sort-confirm-btn" data-action="confirmSort">确认排序 →</button>`;
  }

  return `<div style="width:100%;max-width:520px">
    <div class="top-bar">
      <div class="logo">🧠 AI思维测试</div>
      <div class="step-badge">${state.current + 1} / ${total}</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-thumb" style="width:${(done / total) * 100}%"></div></div>
      <div class="progress-dots">
        ${state.questions.map((_, i) =>
          `<div class="p-dot ${i === state.current ? 'active' : ''} ${state.answers[state.questions[i].id] !== undefined ? 'done' : ''}"></div>`
        ).join('')}
      </div>
    </div>
    <div class="card">
      <div>
        <span class="q-type-tag">${q.qType === 'choice' ? '选择题' : q.qType === 'tf' ? '判断题' : '排序题'}</span>
        <span class="q-dim">${DIM_NAMES[q.dim]}</span>
      </div>
      <div class="question-text">${q.text}</div>
      ${body}
    </div>
    ${q.qType !== 'sort' ? `
    <div class="nav-row">
      ${isLast
        ? `<button class="nav-btn nav-next" data-action="submit">🔮 查看结果 →</button>`
        : `<button class="nav-btn nav-next" data-action="next">下一题 →</button>`
      }
    </div>` : ''}
  </div>`;
}

function renderResult() {
  const r      = state.result;
  const td     = TYPE_DATA[r.type];
  const shared = state.shared;
  const maxDim = r.pcts.indexOf(Math.max(...r.pcts));
  const minDim = r.pcts.indexOf(Math.min(...r.pcts));

  let html = `<div style="width:100%;max-width:520px">
    <div class="top-bar">
      <div class="logo">🧠 AI思维测试</div>
      <div class="step-badge">测试完成</div>
    </div>
    <div class="card result-hero">
      <div class="result-score-wrap">
        <div class="result-score-glow"></div>
        <div class="result-score">${r.total}</div>
      </div>
      <div class="result-label">你的思维天赋得分</div>
      <div class="type-badge"><span class="icon">${td.icon}</span>${r.type}</div>
      <div class="type-super">${td.super}</div>
    </div>`;

  if (!shared) {
    html += `
    <div class="unlock-card">
      <div class="unlock-icon">🔓</div>
      <div class="unlock-title">你是"${r.type}"！</div>
      <div class="unlock-desc">分享给朋友，免费解锁完整分析报告<br>优劣势 + 隐形能力 + 成长建议</div>
      <div class="unlock-score">${r.total}分</div>
      <button class="share-btn" data-action="share">🔗 点击分享 → 免费解锁完整报告</button>
      <div class="bottom-btns">
        <button class="bottom-btn" data-action="restart">🔄 重新测试</button>
        <button class="bottom-btn" data-action="home">🏠 返回首页</button>
      </div>
    </div>`;
  } else {
    const dimLabels = ['逻辑推理','语言表达','AI协作','创意想象'];
    html += `
    <div class="ability-card">
      <div class="section-title"><span class="icon">📊</span> 四维能力雷达</div>
      ${r.pcts.map((p, i) => {
        const badge = i === maxDim ? ' · 最强' : i === minDim ? ' · 待提升' : '';
        return `
        <div class="ability-row" style="margin-top:10px">
          <span class="ability-icon">${['🔮','💬','🤖','✨'][i]}</span>
          <span class="ability-name">${dimLabels[i]}</span>
          <div class="ability-bar-bg"><div class="ability-bar-fill" style="width:${p}%;background:${DIM_COLORS[i]}"></div></div>
          <span class="ability-pct" style="color:${DIM_COLORS[i]}">${p}%${badge}</span>
        </div>
        <div class="ability-detail">${td.dimDesc[i]}</div>`;
      }).join('')}
    </div>

    <div class="strength-card">
      <div class="section-title"><span class="icon">⚡</span> 优劣势分析</div>
      <div class="strength-item">
        <div class="strength-icon pro">💪</div>
        <div class="strength-text">
          <div class="strength-label pro">核心优势</div>
          ${td.strengths.map(s => `<div class="strength-detail">• ${s}</div>`).join('')}
        </div>
      </div>
      <div class="strength-item" style="margin-top:14px">
        <div class="strength-icon con">📉</div>
        <div class="strength-text">
          <div class="strength-label con">待提升点</div>
          ${td.weaknesses.map(w => `<div class="strength-detail">• ${w}</div>`).join('')}
        </div>
      </div>
    </div>

    <div class="strength-card">
      <div class="section-title"><span class="icon">💎</span> 隐形能力 · 多数人不知道</div>
      ${td.hiddenAbilities.map((h, i) => `
      <div class="strength-item">
        <div class="strength-icon hidden">💎</div>
        <div class="strength-text">
          <div class="strength-label hidden">隐性优势 ${i + 1}</div>
          <div class="strength-detail">${h}</div>
        </div>
      </div>`).join('')}
    </div>

    <div class="growth-card">
      <div class="section-title"><span class="icon">🚀</span> 行动建议 · 立刻可以做的事</div>
      ${td.growth.map((g, i) => `
        <div class="growth-item">
          <div class="growth-num">${i + 1}</div>
          <div class="growth-text">${g}</div>
        </div>`).join('')}
    </div>

    <button class="nav-btn nav-next" style="margin-bottom:12px" data-action="share">🖼️ 保存分享图</button>
    <div class="bottom-btns">
      <button class="bottom-btn" data-action="restart">🔄 重新测试</button>
      <button class="bottom-btn" data-action="home">🏠 返回首页</button>
    </div>`;
  }

  return html + `<p class="footer-note">AI思维测试 · 每种思维方式都有独特价值</p></div>`;
}

function renderHistory() {
  const h = getHistory();
  return `<div class="card" style="text-align:center;padding:28px">
    <div class="section-title" style="justify-content:center"><span class="icon">📜</span> 历史记录</div>
    ${h.length === 0
      ? `<div class="history-empty">还没有测试记录，开始你的第一次测试吧</div>`
      : h.map((r, i) => {
        const td = TYPE_DATA[r.type];
        return `
        <div class="history-item">
          <div style="text-align:left">
            <div class="history-type">${td ? td.icon : ''} ${r.type}</div>
            <div class="history-date">${r.date}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="history-score">${r.score}分</span>
            <span class="history-del" data-action="delHistory" data-param="${i}">删除</span>
          </div>
        </div>`;
      }).join('')
    }
    <button class="nav-btn nav-next" style="margin-top:20px" data-action="home">← 返回首页</button>
  </div>
  <p class="footer-note">测试结果仅供娱乐参考</p>`;
}

// ═══════════════════════════════════════════════
// 分享图
// ═══════════════════════════════════════════════
function downloadShare() {
  const r = state.result;
  const t = TYPE_DATA[r.type];
  const cv = document.createElement('canvas');
  cv.width = 400; cv.height = 580;
  const ctx = cv.getContext('2d');

  // 背景
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, 400, 580);

  // 渐变光晕
  const grad = ctx.createRadialGradient(200, 0, 0, 200, 0, 500);
  grad.addColorStop(0, 'rgba(99,102,241,0.25)');
  grad.addColorStop(0.5, 'rgba(167,85,247,0.08)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 400, 350);

  // 顶部标签
  ctx.fillStyle = 'rgba(99,102,241,0.15)';
  ctx.beginPath(); ctx.roundRect(140, 30, 120, 28, 14); ctx.fill();
  ctx.fillStyle = '#a5b4fc'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('AI思维测试', 200, 49);

  // 分数
  ctx.fillStyle = '#f1f5f9'; ctx.font = 'bold 72px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(r.total, 200, 130);

  // 标签
  ctx.fillStyle = 'rgba(99,102,241,0.2)';
  ctx.beginPath(); ctx.roundRect(120, 148, 160, 38, 19); ctx.fill();
  ctx.strokeStyle = 'rgba(99,102,241,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(120, 148, 160, 38, 19); ctx.stroke();
  ctx.fillStyle = '#f1f5f9'; ctx.font = 'bold 17px sans-serif';
  ctx.fillText(t.icon + ' ' + r.type, 200, 175);

  // 雷达
  const colors = ['#818cf8','#34d399','#fbbf24','#f472b6'];
  const names  = ['逻辑推理','语言表达','AI协作','创意想象'];
  r.pcts.forEach((p, i) => {
    const y = 218 + i * 52;
    ctx.fillStyle = '#94a3b8'; ctx.font = '13px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(names[i], 44, y);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.roundRect(44, y + 7, 195, 6, 3); ctx.fill();
    ctx.fillStyle = colors[i];
    ctx.beginPath(); ctx.roundRect(44, y + 7, 195 * p / 100, 6, 3); ctx.fill();
    ctx.fillStyle = colors[i]; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(p + '%', 300, y + 3);
  });

  // 底部语
  ctx.fillStyle = '#475569'; ctx.font = 'italic 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('"' + t.super + '"', 200, 528);

  ctx.fillStyle = '#3b3b5c'; ctx.font = '10px sans-serif';
  ctx.fillText('czxcyy.github.io/ai', 200, 558);

  const link = document.createElement('a');
  link.download = `AI思维测试_${r.total}分_${r.type}.png`;
  link.href = cv.toDataURL();
  link.click();

  if (!state.shared) {
    state.shared = true;
    render();
    showToast('分享图已保存！完整报告已解锁 🌟');
  } else {
    showToast('分享图已保存！');
  }
}

// ═══════════════════════════════════════════════
// 启动
// ═══════════════════════════════════════════════
render();
</script>
</body>
</html>
